# SensoNet - Mosquitto 2.x
# Solo hay un listener y es TLS: no existe puerto sin cifrar.
per_listener_settings false

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
# Versión mínima de TLS aceptada
tls_version tlsv1.2

allow_anonymous false
# passwd se genera al arrancar a partir de variables de entorno (entrypoint.sh)
password_file /mosquitto/data/passwd
acl_file      /mosquitto/config/acl

# Límites contra abuso / denegación de servicio
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 1000
max_connections 200

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
