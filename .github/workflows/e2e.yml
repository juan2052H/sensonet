name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Simulador → broker → backend → dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env de CI (secretos aleatorios, solo para esta ejecución)
        run: |
          cp .env.example .env
          rnd() { openssl rand -hex 16; }
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(rnd)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^MQTT_BACKEND_PASSWORD=.*|MQTT_BACKEND_PASSWORD=$(rnd)|" .env
          sed -i "s|^MQTT_NODES=.*|MQTT_NODES=sim-sala:$(rnd),sim-lab:$(rnd),sim-bodega:$(rnd)|" .env
          sed -i "s|^SENSONET_ADMIN_PASSWORD=.*|SENSONET_ADMIN_PASSWORD=e2e-admin-password|" .env
          sed -i "s|^SIM_INTERVALO=.*|SIM_INTERVALO=5|" .env
      - name: Levantar el sistema con el simulador
        run: docker compose --profile demo up --build -d
      - name: Esperar al backend
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs backend --tail 100
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          ADMIN_EMAIL: admin@sensonet.local
          ADMIN_PASSWORD: e2e-admin-password
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs si falla
        if: failure()
        run: docker compose --profile demo logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
