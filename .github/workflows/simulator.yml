name: simulator

on:
  push:
    branches: [main]
    paths: ["simulator/**", ".github/workflows/simulator.yml"]
  pull_request:
    paths: ["simulator/**", ".github/workflows/simulator.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
