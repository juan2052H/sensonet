version: 2
# Las actualizaciones menores y de parche llegan agrupadas en un solo PR por ecosistema.
# Las mayores llegan por separado porque pueden requerir cambios de código.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      maven-menores:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-menores:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node deben coincidir con la versión de Node que usa el proyecto (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /simulator
    schedule: { interval: weekly }
    groups:
      simulador:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      acciones:
        patterns: ["*"]
